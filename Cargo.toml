# cargo update; cargo upgrade

[package]
name = "op-log"
version = "0.2.6"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
# write_date (write_to_file.rs) uses `DelayedFormat::write_to`, added in
# chrono 0.4.40 — a resolve below that fails to compile there, not silently.
chrono = { version = "0.4" }
chrono-tz = "0.10"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
rand = "0.10"
log = { version = "0.4", features = ["std"] }
[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
